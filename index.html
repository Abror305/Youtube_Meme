<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Responsive 3D Carousel</title>

    <style>
        :root {
            --bg1: #fff7f2;
            --bg2: #ffe8db;

            --text: #222;

            --card-width: 17rem;
            --duration: 30s;
        }

        /* =========================
	RESET
========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* =========================
	BODY
========================= */

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;

            background:
                linear-gradient(135deg,
                    var(--bg1),
                    var(--bg2));
        }

        /* =========================
	TITLE
========================= */

        .title {
            font-size: clamp(1.5rem, 4vw, 3rem);
            font-weight: 800;
            text-align: center;

            color: var(--text);

            letter-spacing: 1px;

            padding-inline: 1rem;

            text-shadow:
                0 3px 10px rgba(0, 0, 0, .08);
        }

        /* =========================
	SCENE
========================= */

        .scene {
            width: 100vw;
            height: 75vh;

            display: grid;
            place-items: center;

            overflow: hidden;

            perspective: 1200px;

            mask:
                linear-gradient(90deg,
                    transparent,
                    black 10% 90%,
                    transparent);

            -webkit-mask:
                linear-gradient(90deg,
                    transparent,
                    black 10% 90%,
                    transparent);
        }

        /* =========================
	3D CONTAINER
========================= */

        .a3d {
            display: grid;

            transform-style: preserve-3d;

            animation: spin var(--duration) linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotateY(1turn);
            }
        }

        /* =========================
	CARDS
========================= */

        .card {
            --w: var(--card-width);
            --angle: calc(1turn / var(--n));

            grid-area: 1 / 1;

            width: var(--w);

            aspect-ratio: 7 / 10;

            object-fit: cover;

            border-radius: 1.4rem;

            border: 4px solid rgba(255, 255, 255, .5);

            box-shadow:
                0 15px 35px rgba(0, 0, 0, .18);

            backface-visibility: hidden;

            -webkit-user-drag: none;
            user-select: none;

            transition:
                transform .4s ease,
                box-shadow .4s ease,
                filter .4s ease;

            filter: saturate(1.05);

            transform:
                rotateY(calc(var(--i) * var(--angle))) translateZ(calc(-1 * (.5 * var(--w) + .5rem) / tan(.5 * var(--angle))));
        }

        /* Desktop hover */
        .card:hover {
            filter: brightness(1.08);

            box-shadow:
                0 25px 55px rgba(0, 0, 0, .25);
        }

        /* =========================
	TABLET
========================= */

        @media (max-width: 900px) {

            :root {
                --card-width: 13rem;
                --duration: 24s;
            }

            .scene {
                height: 70vh;
                perspective: 900px;
            }
        }

        /* =========================
	MOBILE
========================= */

        @media (max-width: 600px) {

            :root {
                --card-width: 8.5rem;
                --duration: 18s;
            }

            body {
                gap: 1rem;
            }

            .title {
                font-size: 1.4rem;
                padding-top: 1rem;
            }

            .scene {
                height: 68vh;
                perspective: 650px;

                mask:
                    linear-gradient(90deg,
                        transparent,
                        black 2% 98%,
                        transparent);

                -webkit-mask:
                    linear-gradient(90deg,
                        transparent,
                        black 2% 98%,
                        transparent);
            }

            .card {
                border-radius: 1rem;

                border-width: 2px;

                box-shadow:
                    0 10px 25px rgba(0, 0, 0, .16);
            }
        }

        /* =========================
	SMALL MOBILE
========================= */

        @media (max-width: 380px) {

            :root {
                --card-width: 7rem;
                --duration: 16s;
            }

            .title {
                font-size: 1.1rem;
            }
        }

        /* =========================
	ACCESSIBILITY
========================= */

        @media (prefers-reduced-motion: reduce) {

            .a3d {
                animation-duration: 120s;
            }
        }
    </style>
</head>

<body>

    <h1 class="title">

    </h1>

    <div class="scene">
